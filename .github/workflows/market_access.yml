name: Check exchange market access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python scripts/probe_market_access.py
      - uses: actions/upload-artifact@v7
        with:
          name: exchange-market-access
          path: runtime/market_access.json
          retention-days: 7
