name: Crypto Alert Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 2. 이전 실행의 alert_history.json 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: alert_history.json
          key: alert-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            alert-history-${{ github.ref_name }}-
            alert-history-

      - name: 3. 파이썬 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
          cache: 'pip'

      - name: 4. 필수 라이브러리 및 한글 폰트 설치
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-nanum
          rm -rf ~/.cache/matplotlib
          pip install -r requirements.txt

      - name: 5. 봇 실행 (환경변수 주입)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: 6. 최신 alert_history.json 캐시 저장
        uses: actions/cache/save@v4
        if: always()
        with:
          path: alert_history.json
          key: alert-history-${{ github.ref_name }}-${{ github.run_id }}