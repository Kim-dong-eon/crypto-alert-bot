name: Crypto Alert Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 저장소 코드 불러오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }} # 현재 브랜치(v2-channel) 명시적 연결

      - name: 2. 파이썬 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
          cache: 'pip'

      - name: 3. 필수 라이브러리 및 한글 폰트 설치
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-nanum
          rm -rf ~/.cache/matplotlib
          pip install -r requirements.txt

      - name: 4. 봇 실행 (환경변수 주입)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: 5. 깃허브 저장소에 json 기록 직접 업데이트 (이메일 에러 방지)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add alert_history.json
          
          # 파일에 변경사항이 있을 때만 커밋 및 푸시 진행
          if ! git diff-index --quiet HEAD; then
            # [skip ci] 태그를 달아 이 커밋으로 인해 다른 워크플로우가 연쇄 실행되는 것을 방지
            git commit -m "auto: alert_history.json 기록 갱신 [skip ci]"
            git push origin HEAD
          else
            echo "알림 기록에 변경사항이 없어 커밋을 건너뜁니다."
          fi