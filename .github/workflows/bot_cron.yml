name: ICT Overlap Alerts

on:
  # cron-job.org calls this dispatch endpoint every minute.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only: no Telegram delivery or lock-state update'
        type: boolean
        default: false
      unlock_symbol:
        description: 'Optional: unlock this exchange symbol, e.g. BTCUSDT'
        type: string
        default: ''
      resend_current:
        description: 'One run only: resend all currently eligible zones, then keep normal locks enabled'
        type: boolean
        default: false
      reset_alerts:
        description: 'Start a fresh alert ledger from this run'
        type: boolean
        default: false
      inspect_symbol:
        description: 'One run only: send all three scope states; comma-separated verified symbols, e.g. BTCUSDT,AAPLUSDT'
        type: string
        default: ''
      unlock_track:
        description: 'Scope to unlock: short=단기, medium=중기, long=장기'
        type: choice
        options: [fast, short, medium, long]
        default: short

permissions:
  contents: write

concurrency:
  group: ict-overlap-${{ github.repository }}
  cancel-in-progress: false

jobs:
  run-bot:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
      MPLBACKEND: Agg
    steps:
      - name: Checkout current default branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}

      - name: Synchronize delivery receipts and minute cursors
        env:
          BOT_BRANCH: ${{ github.ref_name }}
        run: git pull --ff-only origin "$BOT_BRANCH"

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Restore installed dependencies and fonts
        id: ict_runtime
        uses: actions/cache/restore@v6
        with:
          path: runtime/ict_overlap/installed
          key: ict-installed-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements-ict.txt') }}

      - name: Build dependencies and fonts on cache miss
        id: build_runtime
        if: steps.ict_runtime.outputs.cache-hit != 'true'
        run: |
          installed="$GITHUB_WORKSPACE/runtime/ict_overlap/installed"
          python -m pip install --no-cache-dir --target "$installed/python" -r requirements-ict.txt
          package_dir="$(mktemp -d)"
          cd "$package_dir"
          if ! apt-get download fonts-nanum; then
            sudo apt-get update -qq
            apt-get download fonts-nanum
          fi
          dpkg-deb -x fonts-nanum_*.deb extracted
          mkdir -p "$installed/fonts"
          install -m 644 extracted/usr/share/fonts/truetype/nanum/*.ttf "$installed/fonts/"

      - name: Use installed dependencies and fonts
        run: |
          installed="$GITHUB_WORKSPACE/runtime/ict_overlap/installed"
          printf 'PYTHONPATH=%s\nICT_CHART_FONT_DIR=%s\n' "$installed/python" "$installed/fonts" >> "$GITHUB_ENV"

      - name: Verify pullback alerts, delivery locks and charts
        if: inputs.dry_run
        run: python -m unittest tests.test_ict_overlap tests.test_overlap_charts tests.test_overlap_structure tests.test_common_listings tests.test_overlap_diversification tests.test_overlap_status tests.test_structure_review tests.test_structure_alerts tests.test_overlap_entry tests.test_anchored_overlap tests.test_pullback_alerts tests.test_staircase_rules tests.test_star_alerts tests.test_star_retests tests.test_unified_alerts tests.test_alert_confluence tests.test_alert_presentation tests.test_live_weekly tests.test_formation_map -q

      - name: Restore closed-candle cache
        id: candles
        uses: actions/cache/restore@v6
        with:
          path: runtime/ict_overlap/cache
          key: ict-candles-v10-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ict-candles-v10-${{ runner.os }}-
            ict-candles-v9-${{ runner.os }}-

      - name: Scan and deliver LONG/SHORT chart alerts
        id: scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_SEND: ${{ inputs.dry_run != true }}
          UNLOCK_SYMBOL: ${{ inputs.unlock_symbol }}
          UNLOCK_TRACK: ${{ inputs.unlock_track }}
          BOT_RESEND: ${{ inputs.resend_current }}
          BOT_RESET: ${{ inputs.reset_alerts }}
          BOT_INSPECT: ${{ inputs.inspect_symbol }}
        run: |
          touch "$RUNNER_TEMP/ict-candle-cache-start"
          if [ "$BOT_SEND" = "true" ]; then
            if [ -n "$UNLOCK_SYMBOL" ]; then
              python run_ict_overlap.py --state alert_state/ict_overlap.json --unlock "$UNLOCK_SYMBOL" "$UNLOCK_TRACK"
            fi
            args=(--send --state alert_state/ict_overlap.json --snapshot runtime/ict_overlap/actions.json)
            if [ "$BOT_RESEND" = "true" ]; then
              args+=(--resend-current)
            fi
            if [ "$BOT_RESET" = "true" ]; then
              args+=(--reset-alerts)
            fi
            if [ -n "$BOT_INSPECT" ]; then
              args+=(--inspect-symbol "$BOT_INSPECT")
            fi
            python -u run_ict_overlap.py "${args[@]}"
          else
            python -u run_ict_overlap.py --render-preview --state alert_state/ict_overlap.json --snapshot runtime/ict_overlap/actions.json
          fi

      - name: Persist delivery receipts and minute cursors
        if: always() && steps.scan.outcome != 'skipped' && inputs.dry_run != true
        env:
          BOT_BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- alert_state/ict_overlap.json; then
            exit 0
          fi
          python -c 'import json; from pathlib import Path; json.loads(Path("alert_state/ict_overlap.json").read_bytes())'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- alert_state/ict_overlap.json
          git commit -m 'auto: persist ICT delivery receipts [skip ci]'
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BOT_BRANCH"; then
              exit 0
            fi
            git pull --rebase origin "$BOT_BRANCH"
          done
          exit 1

      - name: Check for updated market cache files
        id: candle_delta
        if: always() && steps.scan.outcome != 'skipped'
        run: |
          if [ -d runtime/ict_overlap/cache ] && [ -f "$RUNNER_TEMP/ict-candle-cache-start" ]; then
            changed="$(find runtime/ict_overlap/cache -type f -newer "$RUNNER_TEMP/ict-candle-cache-start" ! -name instruments.json -print -quit)"
            if [ -n "$changed" ]; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Save reusable closed-candle cache
        if: always() && steps.candle_delta.outputs.changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: runtime/ict_overlap/cache
          key: ${{ steps.candles.outputs.cache-primary-key }}

      - name: Save observation and chart preview
        if: always() && steps.scan.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: ict-observation-${{ github.run_id }}-${{ github.run_attempt }}
          compression-level: 1
          path: |
            runtime/ict_overlap/actions.json
            runtime/ict_overlap/charts/*.png
            alert_state/ict_overlap.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Save installed dependencies and fonts
        if: always() && steps.build_runtime.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: runtime/ict_overlap/installed
          key: ${{ steps.ict_runtime.outputs.cache-primary-key }}
