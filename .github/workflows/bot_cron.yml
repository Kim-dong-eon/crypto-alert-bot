name: Crypto Alert Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

# ★ 깃허브 액션 봇이 에러 없이 파일을 저장(push)할 수 있도록 쓰기 권한 부여
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 저장소 코드 불러오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: 2. 파이썬 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
          cache: 'pip'

      - name: 3. 필수 라이브러리 및 한글 폰트 설치
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-nanum
          rm -rf ~/.cache/matplotlib
          pip install -r requirements.txt

      - name: 4. 봇 실행 (환경변수 주입)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: 5. 깃허브 저장소에 json 기록 직접 업데이트 (이메일 에러 방지)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add alert_history.json
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "auto: alert_history.json 기록 갱신 [skip ci]"
            # 현재 실행 중인 브랜치로 명확하게 푸시하여 에러 차단
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "알림 기록에 변경사항이 없어 커밋을 건너뜁니다."
          fi