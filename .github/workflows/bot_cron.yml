name: ICT Overlap Alerts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only: no Telegram delivery or lock-state update'
        type: boolean
        default: false
      unlock_symbol:
        description: 'Optional: unlock this exchange symbol, e.g. BTCUSDT'
        type: string
        default: ''
      resend_current:
        description: 'One run only: resend all currently eligible zones, then keep normal locks enabled'
        type: boolean
        default: false
      reset_alerts:
        description: 'Start a fresh alert ledger from this run'
        type: boolean
        default: false
      inspect_symbol:
        description: 'One run only: send all three scope states; comma-separated verified symbols, e.g. BTCUSDT,AAPLUSDT'
        type: string
        default: ''
      unlock_track:
        description: 'Scope to unlock: short=단기, medium=중기, long=장기'
        type: choice
        options: [fast, short, medium, long]
        default: short
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: ict-overlap-${{ github.repository }}
  cancel-in-progress: false

jobs:
  run-bot:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
      MPLBACKEND: Agg
    steps:
      - name: Checkout current default branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Synchronize delivery receipts and minute cursors
        env:
          BOT_BRANCH: ${{ github.ref_name }}
        run: git pull --ff-only origin "$BOT_BRANCH"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ict.txt

      - name: Install chart fonts and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          python -m pip install -r requirements-ict.txt

      - name: Verify pullback alerts, delivery locks and charts
        run: python -m unittest tests.test_ict_overlap tests.test_overlap_charts tests.test_overlap_structure tests.test_common_listings tests.test_overlap_diversification tests.test_overlap_status tests.test_structure_review tests.test_structure_alerts tests.test_overlap_entry tests.test_anchored_overlap tests.test_pullback_alerts tests.test_staircase_rules tests.test_star_alerts tests.test_unified_alerts -q

      - name: Restore closed-candle cache
        id: candles
        uses: actions/cache/restore@v6
        with:
          path: runtime/ict_overlap/cache
          key: ict-candles-v10-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ict-candles-v10-${{ runner.os }}-
            ict-candles-v9-${{ runner.os }}-

      - name: Scan and deliver LONG/SHORT chart alerts
        id: scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_SEND: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
          UNLOCK_SYMBOL: ${{ inputs.unlock_symbol }}
          UNLOCK_TRACK: ${{ inputs.unlock_track }}
          BOT_RESEND: ${{ inputs.resend_current }}
          BOT_RESET: ${{ inputs.reset_alerts }}
          BOT_INSPECT: ${{ inputs.inspect_symbol }}
        run: |
          if [ "$BOT_SEND" = "true" ]; then
            if [ -n "$UNLOCK_SYMBOL" ]; then
              python run_ict_overlap.py --state alert_state/ict_overlap.json --unlock "$UNLOCK_SYMBOL" "$UNLOCK_TRACK"
            fi
            args=(--send --state alert_state/ict_overlap.json --snapshot runtime/ict_overlap/actions.json)
            if [ "$BOT_RESEND" = "true" ]; then
              args+=(--resend-current)
            fi
            if [ "$BOT_RESET" = "true" ]; then
              args+=(--reset-alerts)
            fi
            if [ -n "$BOT_INSPECT" ]; then
              args+=(--inspect-symbol "$BOT_INSPECT")
            fi
            python -u run_ict_overlap.py "${args[@]}"
          else
            python -u run_ict_overlap.py --render-preview --state alert_state/ict_overlap.json --snapshot runtime/ict_overlap/actions.json
          fi

      - name: Persist delivery receipts and minute cursors
        if: always() && steps.scan.outcome != 'skipped' && (github.event_name == 'schedule' || inputs.dry_run == false)
        env:
          BOT_BRANCH: ${{ github.ref_name }}
        run: |
          python -m json.tool alert_state/ict_overlap.json > /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- alert_state/ict_overlap.json
          if git diff --cached --quiet -- alert_state/ict_overlap.json; then
            exit 0
          fi
          git commit -m 'auto: persist ICT delivery receipts [skip ci]'
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BOT_BRANCH"; then
              exit 0
            fi
            git pull --rebase origin "$BOT_BRANCH"
          done
          exit 1

      - name: Save reusable closed-candle cache
        if: always() && steps.scan.outcome != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: runtime/ict_overlap/cache
          key: ${{ steps.candles.outputs.cache-primary-key }}

      - name: Save observation and chart preview
        if: always() && steps.scan.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: ict-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime/ict_overlap/actions.json
            runtime/ict_overlap/charts/*.png
            alert_state/ict_overlap.json
          if-no-files-found: ignore
          retention-days: 3
